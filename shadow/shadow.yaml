    network_node_id: 0
    processes:
    - path: ./main
      start_time: 5s
      environment: {"PEERS": "100", "CONNECTTO": "5", "MSG_SIZE": "15000", "FRAGMENTS": "1", "PUBLISHERS": "4", "PUBLISHER_ID": "0", "MESSAGE_DELAY": "3000", "DANNOUNCE": "0"}
