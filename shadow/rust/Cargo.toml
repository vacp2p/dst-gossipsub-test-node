[package]
name = "shadow"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[package.metadata.release]
release = false

[dependencies]
tokio = { version = "1.38", features = ["full"] }
futures = { version = "0.3.30" }
libp2p = { path = "../../../rust-libp2p/libp2p", features = [ "tokio", "gossipsub", "mdns", "noise", "macros", "tcp", "yamux", "quic"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
gethostname = "0.5.0"
chrono = "0.4.39"
byteorder = "1.5.0"
rand = "0.8.5"
